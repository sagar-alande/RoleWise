[project]
name = "rolewise"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "alembic>=1.13",
  "boto3>=1.35",
  "httpx>=0.27",
  "python-jose[cryptography]>=3.3",
  "pypdf>=4.2",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rolewise*"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# B008: FastAPI's Depends()/Query() convention requires a function call as the argument default.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
