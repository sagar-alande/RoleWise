services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rolewise
      POSTGRES_PASSWORD: rolewise
      POSTGRES_DB: rolewise
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rolewise"]
      interval: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3,sqs
    ports: ["4566:4566"]
    volumes:
      - ./infra/localstack-init.sh:/etc/localstack/init/ready.d/init.sh

  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: .env
    command: uvicorn rolewise.api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes: ["./apps/backend:/app", "./packages/prompts:/prompts"]
    environment:
      PROMPTS_DIR: /prompts
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      localstack: {condition: service_started}

  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: .env
    command: python -m rolewise.worker.main
    volumes: ["./apps/backend:/app", "./packages/prompts:/prompts"]
    environment:
      PROMPTS_DIR: /prompts
    depends_on:
      postgres: {condition: service_healthy}
      localstack: {condition: service_started}

  web:
    build:
      context: ./apps/web
      target: dev
    env_file: .env
    volumes: ["./apps/web:/app", "/app/node_modules", "/app/.next"]
    environment:
      # Next's webpack watcher misses file events over Docker Desktop bind mounts on
      # Windows/macOS (unlike the API's watchfiles-based reloader) without polling.
      WATCHPACK_POLLING: "true"
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
